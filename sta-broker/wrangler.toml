name = "fpga-playground-sta-broker"
main = "worker.js"
compatibility_date = "2026-11-05"
workers_dev = true

[[kv_namespaces]]
binding = "STA_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
APP_ORIGIN = "https://iiupor.github.io"
APP_URL = "https://iiupor.github.io/fpga-playground/"
GITHUB_REPOSITORY = "IIupor/fpga-playground"

GITHUB_OWNER_ID = "39133075"

[[durable_objects.bindings]]
name = "STA_GUARD"
class_name = "StaGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StaGuard"]
