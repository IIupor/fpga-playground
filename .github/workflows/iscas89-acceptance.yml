name: ISCAS89 sequential acceptance

on:
  push:
    branches:
      - work/iscas89-sequential
  workflow_dispatch:

jobs:
  iscas89:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install --yes iverilog
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all ISCAS'89 sequential acceptance tests
        run: npx playwright test tests/iscas89-acceptance.spec.js --workers=1 --retries=0
