name: ISCAS85 full routing acceptance

on:
  push:
    branches:
      - work/iscas85-full-routing
      - work/iscas85-compact-routing
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all ISCAS'85 acceptance tests
        run: npx playwright test tests/iscas85-routing-acceptance.spec.js --workers=1 --retries=0
