name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'tests/**'
      - 'test/**'

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Icarus Verilog and Yosys
        run: sudo apt-get update && sudo apt-get install --yes iverilog yosys
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run focused Pathfinder diagnostics
        run: npx playwright test tests/pathfinder.spec.js --reporter=list
      - name: Run full test suite
        run: npm test
