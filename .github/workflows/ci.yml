name: FPGA Playground tests

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch open SKY130 gate-level regression fixtures
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/wilson/risc-v-soc-full-synth.git /tmp/sky130-designs
          git -C /tmp/sky130-designs sparse-checkout set src
          git clone --depth 1 --filter=blob:none --sparse https://github.com/siliconcompiler/lambdapdk.git /tmp/sky130-pdk
          git -C /tmp/sky130-pdk sparse-checkout set lambdapdk/sky130/libs/sky130hd/nldm
          mkdir -p tests/fixtures/sky130
          cp /tmp/sky130-designs/src/*.v tests/fixtures/sky130/
          liberty=$(find /tmp/sky130-pdk/lambdapdk/sky130/libs/sky130hd/nldm -maxdepth 1 -type f -name 'sky130_fd_sc_hd__tt_025C_1v80.lib*' | head -n 1)
          test -n "$liberty"
          if [[ "$liberty" == *.gz ]]; then gzip -dc "$liberty" > tests/fixtures/sky130/sky130_fd_sc_hd__tt_025C_1v80.lib; else cp "$liberty" tests/fixtures/sky130/sky130_fd_sc_hd__tt_025C_1v80.lib; fi
      - name: Vendor pinned SKY130 libraries into the repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sky130-vendor libraries/sky130/verilog libraries/sky130/liberty libraries/sky130/LICENSES
          curl -fL --retry 3 'https://github.com/wilson/risc-v-soc-full-synth/archive/6ed4604cff77c9cc975d64fa50bc67b00de2d4eb.zip' -o /tmp/sky130-vendor/designs.zip
          unzip -q /tmp/sky130-vendor/designs.zip '*/src/*.v' -d /tmp/sky130-vendor
          find /tmp/sky130-vendor -path '*/src/*.v' -type f -exec cp {} libraries/sky130/verilog/ \;
          test "$(find libraries/sky130/verilog -maxdepth 1 -name '*.v' | wc -l)" -eq 35
          curl -fL --retry 3 'https://raw.githubusercontent.com/siliconcompiler/lambdapdk/e8d9fbe31e7ab1c0f82db86c9ae3539b8b622727/lambdapdk/sky130/libs/sky130hd/nldm/sky130_fd_sc_hd__tt_025C_1v80.lib.gz' -o libraries/sky130/liberty/sky130_fd_sc_hd__tt_025C_1v80.lib.gz
          test "$(git hash-object libraries/sky130/liberty/sky130_fd_sc_hd__tt_025C_1v80.lib.gz)" = 'e032d41deb2875be28cfa184b279c64bff6ccd57'
          gzip -dc libraries/sky130/liberty/sky130_fd_sc_hd__tt_025C_1v80.lib.gz > tests/fixtures/sky130/sky130_fd_sc_hd__tt_025C_1v80.lib
          curl -fL --retry 3 'https://raw.githubusercontent.com/siliconcompiler/lambdapdk/e8d9fbe31e7ab1c0f82db86c9ae3539b8b622727/LICENSE' -o libraries/sky130/LICENSES/Apache-2.0
          cat > libraries/sky130/LICENSES/MIT-LICENSE <<'EOF'
          MIT License

          Copyright (c) 2026 Param Saini

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.
          EOF
          cat > libraries/sky130/SOURCES.md <<'EOF'
          # SKY130 library sources

          Pinned third-party source files used by the FPGA Playground hierarchical
          Verilog and Liberty import regression.

          ## Gate-level Verilog
          - Repository: https://github.com/wilson/risc-v-soc-full-synth
          - Commit: `6ed4604cff77c9cc975d64fa50bc67b00de2d4eb`
          - Path: `src/` (all 35 `.v` files)
          - License: MIT; see `LICENSES/MIT-LICENSE`.
          - Files are copied without modification.

          ## SKY130 standard-cell Liberty
          - Repository: https://github.com/siliconcompiler/lambdapdk
          - Commit: `e8d9fbe31e7ab1c0f82db86c9ae3539b8b622727`
          - Path: `lambdapdk/sky130/libs/sky130hd/nldm/sky130_fd_sc_hd__tt_025C_1v80.lib.gz`
          - License: Apache-2.0; see `LICENSES/Apache-2.0`.
          - The compressed file is preserved byte-for-byte. This upstream version
            includes the repository's documented `dont_use` additions.
          - Git blob SHA-1: `e032d41deb2875be28cfa184b279c64bff6ccd57`.
          EOF
          gzip -t libraries/sky130/liberty/sky130_fd_sc_hd__tt_025C_1v80.lib.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add libraries/sky130
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && ! git diff --cached --quiet; then
            git commit -m 'Add pinned SKY130 Verilog and Liberty libraries'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Icarus Verilog and Yosys
        run: sudo apt-get update && sudo apt-get install --yes iverilog yosys
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test --grep-invert "sequential import, placement"
