name: FPGA Playground tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Icarus Verilog and Yosys if missing
        run: |
          if ! command -v iverilog >/dev/null 2>&1 || ! command -v yosys >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes iverilog yosys
          else
            echo "Icarus Verilog and Yosys are already available on this runner."
          fi
      - name: Install dependencies
        run: npm install
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
      - name: Install Playwright Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Run focused Pathfinder diagnostics
        if: ${{ github.ref_name != 'experiment/restore-simple-routing' }}
        run: npx playwright test tests/pathfinder.spec.js --reporter=list
      - name: Run c880 Verilog import/export round-trip only
        if: ${{ github.ref_name == 'experiment/restore-simple-routing' }}
        run: 'npx playwright test tests/benchmark-all.spec.js -g "c880: browser import/export/import preserves circuit structure" --reporter=list'
      - name: Run full browser test suite
        if: ${{ github.ref_name != 'experiment/restore-simple-routing' }}
        run: npm test
