name: FPGA geometry diagnostics

on:
  push:
    branches:
      - diagnostics/geometry-conflict-audit
    paths:
      - 'index.html'
      - 'tests/geometry-conflict-audit.spec.js'
      - '.github/workflows/geometry-diagnostics.yml'
  workflow_dispatch:

jobs:
  geometry-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Icarus Verilog and Yosys
        run: sudo apt-get update && sudo apt-get install --yes iverilog yosys
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run only geometry diagnostics
        run: npx playwright test tests/geometry-conflict-audit.spec.js --workers=1 --retries=0
