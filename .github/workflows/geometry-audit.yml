name: Geometry verification audit

on:
  push:
    branches:
      - work/geometry-verification
  workflow_dispatch:

jobs:
  geometry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit small and medium ISCAS'85 geometry
        run: npx playwright test tests/geometry-audit.spec.js --workers=1 --retries=0
